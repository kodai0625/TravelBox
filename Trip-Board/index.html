<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip Board">
<meta name="theme-color" content="#12161f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/app-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/app-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/app-icon-512.png">
<title>Trip Board</title>
<script>
/* 画面が描かれる前に明暗を決めます。
   ここを後回しにすると、暗い設定の端末で一瞬だけ白い画面が出てしまいます。 */
(function () {
  try {
    var pref = localStorage.getItem('trip-board-v1:theme') || 'auto';
    var dark = pref === 'dark' ||
               (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
<!-- ★ ?v= は「読み込み直させるための版番号」です。
     css か js を直したら、ここの数字をすべて同じ値に1つ上げてください。
     上げないとブラウザが古いファイルを使い続け、直したはずの画面が変わりません。 -->
<link rel="stylesheet" href="css/style.css?v=20260822b">
<!-- 色と書体。style.css より後ろで読むこと（土台の色を上書きするため） -->
<link rel="stylesheet" href="css/design.css?v=20260822b">
<!-- 旅の道具箱 共通デザイン。着せ替えなので、いちばん後ろで読みます -->
<link rel="stylesheet" href="css/travel.css?v=20260822b">
</head>
<body class="paper">

<!-- ===== しるしのもと =====
     形をここに1回だけ書いて、下や js から <use href="#i-○○"> で呼び出します。
     大きさと色は呼び出す側で決めます（線は currentColor）。

     ★ i-globe は Travel Box（玄関）のカードと同じ形です。
       玄関でこのアプリを表しているしるしなので、片方だけ変えないでください。 -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-globe" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.6"/>
      <ellipse cx="12" cy="12" rx="3.9" ry="8.6"/>
      <path d="M4 9.3h16M4 14.7h16M12 3.4v17.2"/>
    </g>
    <circle class="i-ac" cx="15.3" cy="8.2" r="1.5"/>
  </symbol>

  <!-- 読み込み中に回す点線の輪。地球のまわりを回る航路のつもりです -->
  <symbol id="i-orbit" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10.8" fill="none" stroke="currentColor"
            stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2.4 4.6"/>
  </symbol>

  <symbol id="i-home" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.9"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.2 11.3 12 4.2l8.8 7.1"/>
      <path d="M5.6 10.1v9.7h12.8v-9.7"/>
      <path d="M9.7 19.8v-5.2h4.6v5.2"/>
    </g>
  </symbol>

  <!-- ---- タブのしるし ---- -->
  <symbol id="i-search" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="10.6" cy="10.6" r="6.4"/>
      <path d="m15.4 15.4 5 5"/>
    </g>
  </symbol>
  <symbol id="i-grid" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.2"/>
      <path d="M3.2 9.6h17.6M9.4 9.6v9.8M15.2 9.6v9.8"/>
    </g>
  </symbol>
  <symbol id="i-compare" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M4 20h16"/>
      <path d="M7.6 20v-7.4M12 20V6.4M16.4 20v-4.8"/>
    </g>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.6"/>
      <path d="M12 6.8V12l3.6 2.2"/>
    </g>
  </symbol>

  <!-- ---- エリアの見出し ---- -->
  <symbol id="i-pin" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21.2c4.3-4.4 6.5-7.9 6.5-10.5a6.5 6.5 0 1 0-13 0c0 2.6 2.2 6.1 6.5 10.5z"/>
      <circle cx="12" cy="10.5" r="2.4"/>
    </g>
  </symbol>

  <!-- ---- 詳細の見出し ---- -->
  <symbol id="i-sun" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.6V5M12 19v2.4M2.6 12H5M19 12h2.4
               M5.3 5.3 7 7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"/>
    </g>
  </symbol>
  <symbol id="i-coin" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.6"/>
      <path d="M8.6 7.8 12 12.3l3.4-4.5M8.4 12.7h7.2M8.4 15.3h7.2M12 12.3v5"/>
    </g>
  </symbol>
  <symbol id="i-shield" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.1 19 5.7v5.2c0 4.2-2.8 7.9-7 9.5-4.2-1.6-7-5.3-7-9.5V5.7z"/>
      <path d="m8.9 11.8 2.2 2.2 4-4.4"/>
    </g>
  </symbol>
  <symbol id="i-flag" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.2 3.4v17.2"/>
      <path d="M6.2 4.8h10.8l-2.3 3.3 2.3 3.3H6.2"/>
    </g>
  </symbol>
  <symbol id="i-book" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6.6C10.4 5.2 8.2 4.6 5 4.6v12.6c3.2 0 5.4.6 7 2
               1.6-1.4 3.8-2 7-2V4.6c-3.2 0-5.4.6-7 2z"/>
      <path d="M12 6.6v13.6"/>
    </g>
  </symbol>
  <!-- 航空券。値札の形にして「値段の話」だと分かるようにします -->
  <symbol id="i-fare" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.6 3.2H20a.8.8 0 0 1 .8.8v7.4L11.4 20.8a.8.8 0 0 1-1.1 0l-7.1-7.1
               a.8.8 0 0 1 0-1.1z"/>
      <circle cx="16.9" cy="7.1" r="1.4"/>
    </g>
  </symbol>

  <!-- 更新のしるし。時計回りの矢印は「読み込み直す」の共通の形です -->
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </g>
  </symbol>
</svg>

<!-- ===== ヘッダー ===== -->
<header class="app-header">
  <!-- 板の上に薄く描く飾り。航路・地球・飛行機・雲。
       道具箱の中の全アプリで同じ形にそろえてあります。 -->
  <svg class="masthead-art" viewBox="0 0 400 130" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-10 116 Q 130 66 250 92 T 420 40" fill="none" stroke="#f2b33d"
          stroke-width="1.4" stroke-dasharray="4 6" opacity=".34"/>
  </svg>
  <svg class="masthead-art" viewBox="0 0 400 130" aria-hidden="true">
    <!-- ★このアプリは見出しが1行しかないので、地球と飛行機は置いていません。
         置くとボタンや題字と重なってしまうためです。
         Mile Board のように見出しが高いアプリには入れてあります。 -->
    <g fill="#95a2c0" opacity=".13">
      <ellipse cx="132" cy="40" rx="26" ry="6.5"/>
      <ellipse cx="150" cy="35" rx="16" ry="5"/>
      <ellipse cx="286" cy="96" rx="22" ry="6"/>
    </g>
  </svg>

  <div class="app-header__inner">
    <!-- 旅の道具箱（玄関）へ戻る。玄関を通さず直接開いたときも押せます。
         家の形にしているのは、戻る先がこのアプリの最初の画面ではなく
         入れ物のほうだと、記号だけで分かるようにするためです。 -->
    <a class="home-link" href="../"
       title="旅の道具箱に戻る" aria-label="旅の道具箱に戻る">
      <svg class="home-link__icon" aria-hidden="true"><use href="#i-home"/></svg>
    </a>
    <button type="button" class="app-title" id="homeBtn" title="最初の画面に戻る">
      <span class="app-title__mark" aria-hidden="true">
        <svg class="app-title__glyph"><use href="#i-globe"/></svg>
      </span>
      <span class="app-title__text">
        <span class="app-title__main">Trip Board</span>
        <span class="app-title__sub">季節・物価・治安・時差で比較</span>
      </span>
    </button>
    <div class="head-btns">
      <!-- 手動での更新。ふだんは sw.js が自動で新しくしますが、
           古い画面のままのときはここを押します（js/update.js） -->
      <button type="button" class="head-icon" id="updateBtn"
              title="最新版に更新" aria-label="最新版に更新">
        <svg class="head-icon__i" aria-hidden="true"><use href="#i-refresh"/></svg>
      </button>
      <button type="button" class="head-btn" id="themeBtn">自動</button>
    </div>
  </div>

  <!-- タブのしるしは飾りではなく目印です。文字を読まなくても
       「探す＝虫めがね」「時差＝時計」と形で当たりが付きます。 -->
  <nav class="tabs" id="tabs" aria-label="表示切替">
    <button type="button" class="tabs__btn is-active" data-tab="search">
      <svg class="tabs__i" aria-hidden="true"><use href="#i-search"/></svg>探す</button>
    <button type="button" class="tabs__btn" data-tab="table">
      <svg class="tabs__i" aria-hidden="true"><use href="#i-grid"/></svg>一覧表</button>
    <button type="button" class="tabs__btn" data-tab="compare">
      <svg class="tabs__i" aria-hidden="true"><use href="#i-compare"/></svg>比較</button>
    <button type="button" class="tabs__btn" data-tab="clock">
      <svg class="tabs__i" aria-hidden="true"><use href="#i-clock"/></svg>時差</button>
  </nav>
</header>

<main class="page">

  <section class="notice" id="loading">
    <span class="loader" aria-hidden="true">
      <svg class="loader__ring"><use href="#i-orbit"/></svg>
      <svg class="loader__mark"><use href="#i-globe"/></svg>
    </span>
    <p class="notice__text">データを読み込んでいます…</p>
  </section>
  <section class="notice notice--error is-hidden" id="loadError">
    <p class="notice__text" id="loadErrorText"></p>
  </section>

  <!-- ===== 探す ===== -->
  <section class="view is-hidden" id="viewSearch">

    <p class="filter-label">いつ行く</p>
    <div class="chips chips--months" id="monthChips"></div>

    <div class="search">
      <input type="search" class="search__input" id="countrySearch"
             placeholder="国名で探す（例：タイ、Thailand）"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="search__clear is-hidden" id="countryClear" aria-label="消す">✕</button>
    </div>

    <div class="route-toolbar">
      <button type="button" class="filter-btn" id="filterToggle" aria-expanded="false">
        絞り込み<span class="filter-btn__count is-hidden" id="filterCount"></span>
      </button>
      <div class="sortwrap">
        <label class="sortwrap__label" for="sortSel">並び</label>
        <select class="sortsel" id="sortSel">
          <option value="score">天気の良さ</option>
          <option value="price">外食が安い順</option>
          <option value="tz">時差が小さい順</option>
          <option value="name">五十音順</option>
        </select>
      </div>
    </div>

    <div class="filter-panel is-hidden" id="filterPanel">
      <p class="filter-panel__label">地域</p>
      <div class="chips" id="regionChips"></div>

      <p class="filter-panel__label">条件</p>
      <div class="chips" id="condChips">
        <button type="button" class="chip" data-cond="direct">日本から直行便</button>
        <button type="button" class="chip" data-cond="cheap">外食が日本より安い</button>
        <button type="button" class="chip" data-cond="safe">危険情報なし</button>
        <button type="button" class="chip" data-cond="near">時差5時間以内</button>
        <button type="button" class="chip" data-cond="nostorm">選んだ月が台風の季節でない</button>
      </div>
      <p class="filter-panel__note">
        「危険情報なし」は外務省が特段の注意喚起をしていないという意味で、
        安全のお墨付きではありません。<br>
        台風の絞り込みは、国全体が対象の国だけを外します。
        オーストラリア北部やアメリカ東海岸のように一部の地域だけの国は残り、
        一覧に「一部で台風の季節」と出ます。
      </p>
    </div>

    <p class="result-count" id="searchCount"></p>
    <ul class="list" id="searchList"></ul>
  </section>

  <!-- ===== 一覧表 ===== -->
  <section class="view is-hidden" id="viewTable">

    <div class="chips" id="tableRegionChips"></div>

    <div class="legend">
      <span class="legend__label">天気</span>
      <span class="legend__item"><i class="sw sw--4"></i>◎ 雨が少ない</span>
      <span class="legend__item"><i class="sw sw--3"></i>○ わりと少ない</span>
      <span class="legend__item"><i class="sw sw--2"></i>△ ときどき降る</span>
      <span class="legend__item"><i class="sw sw--1"></i>✕ 雨が多い</span>
    </div>
    <div class="legend">
      <span class="legend__label">そのほか</span>
      <span class="legend__item"><i class="sw sw--hot"></i>著しく暑い</span>
      <span class="legend__item"><i class="sw sw--cold"></i>著しく寒い</span>
      <span class="legend__item"><i class="sw sw--storm"></i>台風・サイクロン</span>
      <span class="legend__item"><i class="sw sw--lifted"></i>雨季の変わり目（人のすすめを加えた月）</span>
    </div>

    <div class="matrixwrap">
      <table class="matrix" id="matrix"></table>
    </div>
  </section>

  <!-- ===== 比較 ===== -->
  <section class="view is-hidden" id="viewCompare">
    <div class="search">
      <input type="search" class="search__input" id="compareSearch"
             placeholder="国か都市を足す（例：タイ、ホーチミン）"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="search__clear is-hidden" id="compareClear" aria-label="消す">✕</button>
    </div>
    <ul class="suggest is-hidden" id="compareSuggest"></ul>

    <div class="picked" id="picked"></div>
    <p class="compare-note is-hidden" id="compareNote"></p>
    <p class="filter-label" id="compareMonthLabel">比較する月</p>
    <div class="chips chips--months" id="compareMonthChips"></div>

    <div class="comparewrap">
      <table class="compare" id="compareTable"></table>
    </div>
  </section>

  <!-- ===== 時差 ===== -->
  <section class="view is-hidden" id="viewClock">
    <div class="search">
      <input type="search" class="search__input" id="clockSearch"
             placeholder="国名・都市名で探す"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="search__clear is-hidden" id="clockClear" aria-label="消す">✕</button>
    </div>
    <div class="now" id="nowJapan"></div>
    <ul class="list" id="clockList"></ul>
  </section>

</main>

<!-- ===== 詳細パネル ===== -->
<div class="sheet-backdrop is-hidden" id="sheetBackdrop"></div>
<aside class="sheet is-hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet__grip"></div>
  <div class="sheet__head">
    <h2 class="sheet__title" id="sheetTitle"></h2>
    <button type="button" class="sheet__close" id="sheetClose" aria-label="閉じる">✕</button>
  </div>
  <div class="sheet__body" id="sheetBody"></div>
</aside>

<script src="js/config.js?v=20260822b"></script>
<script src="js/data.js?v=20260822b"></script>
<script src="js/chart.js?v=20260822b"></script>
<script src="js/app.js?v=20260822b"></script>
<script src="js/update.js?v=20260822b"></script>
</body>
</html>
